name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to GigaNodes VPS
    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting automated deployment on VPS..."
            git config --global --add safe.directory /opt/papergrade/app
            cd /opt/papergrade/app
            git fetch origin main
            git reset --hard origin/main
            chown -R papergrade:papergrade /opt/papergrade/app
            echo "📦 Installing updated dependencies..."
            /opt/papergrade/venv/bin/pip install --no-cache-dir -r backend/requirements.txt
            echo "🗄️ Running database migrations..."
            cd /opt/papergrade/app/backend && /opt/papergrade/venv/bin/alembic upgrade head
            cd /opt/papergrade/app
            echo "🔄 Restarting papergrade-backend service..."
            systemctl restart papergrade-backend
            echo "🩺 Verifying backend health (polling up to 60s for DB startup)..."
            for i in {1..30}; do
              if curl -f -s http://127.0.0.1:8000/api/status > /dev/null; then
                echo "✅ Backend is healthy and responding!"
                break
              fi
              echo "Waiting for application startup ($i/30)..."
              sleep 2
            done
            curl -f http://127.0.0.1:8000/api/status
            echo "✅ Deployment completed successfully!"
