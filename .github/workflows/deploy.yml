name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to GigaNodes VPS
    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting automated deployment on VPS..."
            cd /opt/papergrade/app
            git fetch origin main
            git reset --hard origin/main
            echo "📦 Installing updated dependencies..."
            /opt/papergrade/venv/bin/pip install --no-cache-dir -r backend/requirements.txt
            echo "🔄 Restarting papergrade-backend service..."
            systemctl restart papergrade-backend
            sleep 5
            systemctl is-active --quiet papergrade-backend
            echo "🩺 Verifying backend health..."
            curl -f http://127.0.0.1:8000/api/status
            echo "✅ Deployment completed successfully!"
